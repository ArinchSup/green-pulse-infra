apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: backend-secrets
  data:
    - secretKey: SUPABASE_URL
      remoteRef:
        key: /green-pulse/backend/SUPABASE_URL
    - secretKey: SUPABASE_KEY
      remoteRef:
        key: /green-pulse/backend/SUPABASE_KEY