apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-service-secrets
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: ai-service-secrets
  data:
    - secretKey: FINNHUB_API_KEY
      remoteRef:
        key: /green-pulse/ai-service/FINNHUB_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /green-pulse/ai-service/ANTHROPIC_API_KEY